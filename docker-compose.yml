services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env.backend
    ports:
      - "4000:4000"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8090:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
